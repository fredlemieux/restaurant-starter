name: update-visual-baselines

# Manually triggered — regenerates Playwright's visual regression baselines
# on Linux (the CI environment) so `toHaveScreenshot` diffs stay stable.
# Trigger from Actions tab → this workflow → Run workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate baselines on (defaults to the branch you triggered from)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate visual baselines
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
      SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      PUBLIC_SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          # Full history so we can push back to the same branch.
          fetch-depth: 0
          # Use a bot token so the push actually re-runs downstream CI.
          # (Default GITHUB_TOKEN pushes don't trigger workflow re-runs.)
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restaurant/web test:e2e:install
      - name: Regenerate baselines
        run: pnpm --filter @restaurant/web exec playwright test tests/e2e/visual.spec.ts --update-snapshots
      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/visual.spec.ts-snapshots
          if git diff --staged --quiet; then
            echo "No baseline changes — nothing to commit."
            exit 0
          fi
          MSG='chore(test): regenerate visual regression baselines (Linux/chromium)'
          MSG+=$'\n\nAuto-generated by .github/workflows/update-visual-baselines.yml'
          git commit -m "$MSG"
          git push
